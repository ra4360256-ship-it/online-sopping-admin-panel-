<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QX BINARY TRADER AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .phone-screen {
            width: 100%;
            max-width: 380px;
            height: 650px;
            background: linear-gradient(180deg, #121824 0%, #080a0f 100%);
            border-radius: 20px;
            border: 2px solid #2a3245;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .top-bar {
            background: rgba(22, 29, 43, 0.9);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a3245;
        }

        .pair-title {
            font-size: 14px;
            font-weight: bold;
            color: #00b0ff;
        }

        .floating-widget {
            position: absolute;
            top: 220px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .widget-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a384c 0%, #111722 100%);
            border: 3px solid #00b0ff;
            box-shadow: 0 0 15px rgba(0, 176, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .widget-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ff9100;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        .widget-label {
            margin-top: 6px;
            font-size: 10px;
            font-weight: 900;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid rgba(0, 176, 255, 0.4);
            text-align: center;
        }

        .signal-popup {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            width: 220px;
            background: rgba(13, 17, 23, 0.95);
            border-radius: 14px;
            border: 2px solid #00b0ff;
            padding: 15px;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .signal-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
        }

        .popup-action {
            font-size: 20px;
            font-weight: 900;
            margin: 8px 0;
        }

        .bottom-panel {
            background: rgba(22, 29, 43, 0.9);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #2a3245;
            text-align: center;
            font-size: 12px;
            color: #8b949e;
        }
    </style>
</head>
<body>

<div class="phone-screen">
    <div class="top-bar">
        <div>
            <div class="pair-title">EUR/USD (OTC)</div>
            <div style="font-size: 10px; color: #8b949e;">Quotex Market</div>
        </div>
        <div style="font-weight: bold;" id="price">1.0854</div>
    </div>

    <div class="signal-popup" id="signalPopup">
        <div style="font-size: 11px; color: #8b949e;">GEMINI AI SIGNAL</div>
        <div class="popup-action" id="signalText">ANALYZING...</div>
        <div style="font-size: 11px; color: #ffcc00;">1 MINUTE</div>
    </div>

    <div class="floating-widget" onclick="getAISignal()">
        <div class="widget-circle">
            <div class="widget-icon">☠️</div>
        </div>
        <div class="widget-label">𝙌𝙓 𝘽𝙄𝙉𝘼𝙍𝙔 𝙏𝙍𝘼𝘿𝙀𝙍 𓆪</div>
    </div>

    <div class="bottom-panel" id="status">
        Tap the <b>𝙌𝙓 𝘽𝙄𝙉𝘼𝙍𝙔 𝙏𝙍𝘼𝘿𝙀𝙍</b> button for Gemini AI prediction.
    </div>
</div>

<script>
    // আপনার Gemini API Key এখানে বসান
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE";
    let busy = false;

    async function getAISignal() {
        if (busy) return;
        busy = true;

        const popup = document.getElementById('signalPopup');
        const text = document.getElementById('signalText');
        const status = document.getElementById('status');
        const priceElement = document.getElementById('price');

        popup.classList.add('active');
        text.innerText = "AI ANALYZING...";
        text.style.color = "#00b0ff";
        status.innerText = "Connecting to Gemini AI model...";

        // কাল্পনিক ক্যান্ডেল ডেটা তৈরি
        const currentPrice = (1.0850 + Math.random() * 0.0010).toFixed(4);
        priceElement.innerText = currentPrice;
        
        const promptText = `Act as a Binary Trading AI Indicator. Analyze current market price ${currentPrice} for EUR/USD. Respond with ONLY one word: "CALL" or "PUT".`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await response.json();
            const aiResponse = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim().toUpperCase();

            if (aiResponse && aiResponse.includes("CALL")) {
                text.innerText = "CALL (UP) ↑";
                text.style.color = "#00e676";
                status.innerHTML = "<span style='color:#00e676'>Gemini AI: BUY Signal</span>";
            } else {
                text.innerText = "PUT (DOWN) ↓";
                text.style.color = "#ff1744";
                status.innerHTML = "<span style='color:#ff1744'>Gemini AI: SELL Signal</span>";
            }
        } catch (error) {
            // API Key না থাকলে বা এরর হলে ফালব্যাক লজিক
            const isBuy = Math.random() > 0.5;
            text.innerText = isBuy ? "CALL (UP) ↑" : "PUT (DOWN) ↓";
            text.style.color = isBuy ? "#00e676" : "#ff1744";
            status.innerText = "Signal generated (Fallback Mode).";
        }

        setTimeout(() => {
            popup.classList.remove('active');
            busy = false;
            status.innerText = "Ready for next signal.";
        }, 3500);
    }
</script>

</body>
</html>
