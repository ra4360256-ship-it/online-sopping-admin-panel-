<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}

button,input,select,textarea{font-family:inherit;color:inherit;font-size:16px}

img{max-width:100%;display:block}

.app-shell{min-height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-top);padding-left:var(--safe-left);padding-right:var(--safe-right);background:radial-gradient(1200px 600px at 20% -10%,rgba(59,130,246,.18),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(139,92,246,.14),transparent 60%),var(--bg)}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.btn-accent{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}

function subscribeSettings() {
  const r = ref(db, "appSettings");
  const unsub = onValue(r, (snap) => {
    const v = snap.val() || {};
    S.settings = {
      ...S.settings, ...v,
      support: { ...S.settings.support, ...(v.support || {}) },
      depositLimits: { ...S.settings.depositLimits, ...(v.depositLimits || {}) },
      withdrawLimits: { ...S.settings.withdrawLimits, ...(v.withdrawLimits || {}) },

    render();

/* ---------- Auth Functions ---------- */
const genReferralId = () => {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "OLIM";
  for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
};

async function doSignup({ name, phone, email, password, referral }) {
  const cred = await createUserWithEmailAndPassword(auth, email, password);
  const uid = cred.user.uid;
  try { await updateProfile(cred.user, { displayName: name }); } catch {}

  let referredBy = null;
  if (referral && referral.trim()) {
    const idx = await get(ref(db, `referralIndex/${referral.trim().toUpperCase()}`));
    if (idx.exists()) {
      const found = idx.val();
      if (found?.userId && found.userId !== uid) referredBy = found.userId;
    }
  }

  const referralId = genReferralId();
  const profile = {
    userId: uid, name, phone, email, referralId,
    referredBy: referredBy || null,
    accountStatus: "active", emailVerified: false,
    createdAt: nowMs(), role: "user"
  };
  await set(ref(db, `users/${uid}/profile`), profile);
  await set(ref(db, `referralIndex/${referralId}`), { userId: uid, referralId });
  await set(ref(db, `wallets/${uid}`), { balance: 0, currency: "USD", updatedAt: nowMs() });

  if (referredBy) {
    await set(ref(db, `referrals/${referredBy}/${uid}`), {
      referredUserId: uid, createdAt: nowMs(), reward: 0, status: "active"
    });
  }

  try { await sendEmailVerification(cred.user); } catch {}
  S.profile = profile;
}

async function doLogin(email, password) {
  await signInWithEmailAndPassword(auth, email, password);
}

async function doLogout() {
  await signOut(auth);
}

async function sendVerify() {
  if (auth.currentUser) await sendEmailVerification(auth.currentUser);
}

async function refreshVerification() {
  if (!auth.currentUser) return false;
  await auth.currentUser.reload();
  const verified = auth.currentUser.emailVerified;
  if (S.user) await update(ref(db, `users/${S.user.uid}/profile`), { emailVerified: verified });
  return verified;
}

async function resetByPhone(phone) {
  try {
    const r = ref(db, "phoneIndex");
    const snap = await get(r);
    if (snap.exists()) {
      const entries = Object.values(snap.val());
      const found = entries.find(e => e?.phone === phone.trim());
      if (found?.email) await sendPasswordResetEmail(auth, found.email);
    }
  } catch {}
}

const DEMO_MARKET_PRICES = {
  "EUR/USD": 1.1023, "GBP/USD": 1.2650, "USD/JPY": 149.85, "AUD/USD": 0.6580,
  "NZD/USD": 0.6020, "USD/CAD": 1.3650, "USD/CHF": 0.8850, "EUR/GBP": 0.8715,
  "EUR/JPY": 165.20, "GBP/JPY": 189.55, "BTC/USD": 67500, "ETH/USD": 3250,
  "LTC/USD": 82.5, "XRP/USD": 0.6250, "SOL/USD": 165.5, "XAU/USD": 2650.00,
  "XAG/USD": 31.50, "CRUDE OIL": 78.50, "BRENT OIL": 82.30, "NATURAL GAS": 2.85,
  "S&P 500": 5750.00, "NASDAQ 100": 20150.00, "DOW JONES": 42300.00,
};

const CATEGORY_FALLBACK = {
  "BTC/USD":"CRYPTO","ETH/USD":"CRYPTO","LTC/USD":"CRYPTO","XRP/USD":"CRYPTO","SOL/USD":"CRYPTO",
  "XAU/USD":"COMMODITIES","XAG/USD":"COMMODITIES","CRUDE OIL":"COMMODITIES","BRENT OIL":"COMMODITIES","NATURAL GAS":"COMMODITIES",
  "S&P 500":"INDICES","NASDAQ 100":"INDICES","DOW JONES":"INDICES",
};

function getMarketList() {
  const fromDB = Object.entries(S.markets || {}).map(([key, m]) => ({
    key, name: m.name || key, category: m.category || CATEGORY_FALLBACK[key] || "FOREX",
    enabled: m.enabled !== false, displayOrder: m.displayOrder || 999,
  }));
  if (fromDB.length === 0) {
    return Object.keys(DEMO_MARKET_PRICES).map((k,i) => ({
      key: k.replace(/\s+/g,"_").replace(/\//g,"_"), name: k,
      category: CATEGORY_FALLBACK[k] || "FOREX", enabled: true, displayOrder: i,
    }));
  }
  return fromDB.filter(m => m.enabled).sort((a,b) => a.displayOrder - b.displayOrder);
}

function marketPrice(symbol) {
  const base = DEMO_MARKET_PRICES[symbol] ?? 100;
  const t = Date.now() / 5000;
  const noise = Math.sin(t + symbol.length) * 0.0015 + (Math.random() - 0.5) * 0.0008;
  return base * (1 + noise);
}

async function placeTrade({ marketSymbol, direction, amount, durationSec }) {
  if (!S.user) { nav("login"); return; }
  if (!S.connection) { toast("Connection lost. Please check your internet connection.", "error"); return; }
  const bal = Number(S.wallet.balance || 0);
  const amt = Number(amount);
  if (!amt || amt <= 0) { toast("Invalid Amount", "error"); return; }
  if (amt > bal) { toast("Insufficient Balance", "error"); return; }
  if (amt < 1) { toast("Minimum trade is $1", "error"); return; }

  const entry = marketPrice(marketSymbol);
  const tradeId = push(child(ref(db), `trades/${S.user.uid}`)).key;
  const startTime = nowMs();
  const endTime = startTime + durationSec * 1000;

  const trade = {
    tradeId, userId: S.user.uid, email: S.user.email,
    market: marketSymbol, direction, amount: amt, duration: durationSec,
    entryPrice: entry, startTime, endTime, status: "active",
    payoutRate: 0.7, mode: "demo"
  };

  await set(ref(db, `trades/${S.user.uid}/${tradeId}`), trade);

  const newBalance = +(bal - amt).toFixed(2);
  await update(ref(db, `wallets/${S.user.uid}`), { balance: newBalance, updatedAt: nowMs() });
  await set(ref(db, `walletLedger/${S.user.uid}/${tradeId}_debit`), {
    transactionId: tradeId + "_debit", userId: S.user.uid, amount: -amt, currency: "USD",
    type: "TRADE_DEBIT", source: "trade", referenceId: tradeId, createdAt: nowMs()
  });

  S.activeTrade = trade;
  pushNotification(S.user.uid, "Trade Started", `${marketSymbol} ${direction} $${amt}`, "trade", "/trade");
  scheduleTradeResolve(trade);
  nav("trade");
}

function scheduleTradeResolve(trade) {
  const remain = trade.endTime - nowMs();
  if (remain <= 0) { resolveTrade(trade); return; }
  setTimeout(() => resolveTrade(trade), remain + 400);
}

async function resolveTrade(trade) {
  const exit = marketPrice(trade.market);
  const win = (trade.direction === "UP" && exit > trade.entryPrice) ||
              (trade.direction === "DOWN" && exit < trade.entryPrice);
  const payout = win ? +(trade.amount * (1 + (trade.payoutRate||0.7))).toFixed(2) : 0;
  const profit = win ? +(trade.amount * (trade.payoutRate||0.7)).toFixed(2) : -trade.amount;

  await update(ref(db, `trades/${trade.userId}/${trade.tradeId}`), {
    exitPrice: exit, status: "completed", result: win ? "PROFIT" : "LOSS",
    profit, payout, resolvedAt: nowMs()
  });

  if (win) {
    const walletSnap = await get(ref(db, `wallets/${trade.userId}`));
    const curBal = Number(walletSnap.val()?.balance || 0);
    const newBal = +(curBal + payout).toFixed(2);
    await update(ref(db, `wallets/${trade.userId}`), { balance: newBal, updatedAt: nowMs() });
    await set(ref(db, `walletLedger/${trade.userId}/${trade.tradeId}_credit`), {
      transactionId: trade.tradeId + "_credit", userId: trade.userId, amount: payout,
      currency: "USD", type: "TRADE_PROFIT", source: "trade", referenceId: trade.tradeId, createdAt: nowMs()
    });
  }

  pushNotification(
    trade.userId,
    win ? "Trade Completed — Profit 🎉" : "Trade Completed — Loss",
    `${trade.market} ${trade.direction} $${trade.amount} → ${win ? "+$" + profit : "-$" + trade.amount}`,
    "trade", "/history"
  );

  if (S.activeTrade?.tradeId === trade.tradeId) S.activeTrade = null;
  render();
}

async function pushNotification(uid, title, message, category, url) {
  try {
    const id = push(child(ref(db), `notifications/${uid}`)).key;
    await set(ref(db, `notifications/${uid}/${id}`), {
      notificationId: id, userId: uid, title, message, category,
      url: url || null, read: false, createdAt: nowMs()
    });
  } catch (e) { console.warn("Push notification failed:", e); }
}

/* ---------- Deposit ---------- */
async function submitDeposit({ usdAmount, bdtAmount, rate, method, transactionId, screenshotFile }) {
  if (!S.user) { nav("login"); return; }
  if (!transactionId || transactionId.trim().length < 4) { toast("Invalid Payment Reference", "error"); return; }

  let screenshotUrl = null;
  if (screenshotFile) {
    try {
      const path = `deposits/${S.user.uid}/${nowMs()}_${screenshotFile.name}`;
      const sref = sRef(storage, path);
      await uploadBytes(sref, screenshotFile);
      screenshotUrl = await getDownloadURL(sref);
    } catch (e) { console.warn("Upload failed:", e); }
  }

  const depId = push(child(ref(db), `deposits/${S.user.uid}`)).key;
  const deposit = {
    depositId: depId, userId: S.user.uid, email: S.user.email,
    usdAmount, bdtAmount, rate, paymentMethod: method,
    transactionId, screenshot: screenshotUrl, status: "Pending", createdAt: nowMs()
  };
  await set(ref(db, `deposits/${S.user.uid}/${depId}`), deposit);
  await set(ref(db, `adminDepositQueue/${depId}`), {
    depositId: depId, userId: S.user.uid, email: S.user.email,
    usdAmount, bdtAmount, paymentMethod: method, transactionId, status: "Pending", createdAt: nowMs()
  });

  pushNotification(S.user.uid, "Deposit Request Received", `Your $${usdAmount} deposit is pending review.`, "deposit", "/wallet");
}

/* ---------- Withdrawal ---------- */
async function submitWithdrawal({ usdAmount, method, number }) {
  if (!S.user) { nav("login"); return; }
  const bal = Number(S.wallet.balance || 0);
  if (usdAmount > bal) { toast("Insufficient Balance", "error"); return; }
  if (usdAmount < (S.settings.withdrawLimits?.min || 1)) { toast(`Min withdrawal $${S.settings.withdrawLimits?.min || 1}`, "error"); return; }
  if (usdAmount > (S.settings.withdrawLimits?.max || 350)) { toast(`Max withdrawal $${S.settings.withdrawLimits?.max || 350}`, "error"); return; }
  if (!number || number.trim().length < 6) { toast("Invalid payment number", "error"); return; }

  const wdId = push(child(ref(db), `withdrawals/${S.user.uid}`)).key;
  const bdtAmount = usdAmount * (S.settings.withdrawRate || 125);
  const withdrawal = {
    withdrawalId: wdId, userId: S.user.uid, email: S.user.email,
    usdAmount, bdtAmount, rate: S.settings.withdrawRate || 125,
    paymentMethod: method, paymentNumber: number, status: "Pending", createdAt: nowMs()
  };
  await set(ref(db, `withdrawals/${S.user.uid}/${wdId}`), withdrawal);
  await set(ref(db, `adminWithdrawQueue/${wdId}`), {
    withdrawalId: wdId, userId: S.user.uid, email: S.user.email,
    usdAmount, bdtAmount, paymentMethod: method, status: "Pending", createdAt: nowMs()
  });

  pushNotification(S.user.uid, "Withdrawal Request Received", `Your $${usdAmount} withdrawal is pending review.`, "withdrawal", "/wallet");
}

function renderConnBanner() {
  let el = $("#conn-banner");
  if (!el) {
    el = document.createElement("div");
    el.id = "conn-banner";
    document.body.appendChild(el);
  }
  if (S.connection) {
    el.className = "conn-banner conn-online";
    el.textContent = "Firebase Connected";
    el.style.display = "block"; el.style.opacity = "1";
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.opacity = "0"; setTimeout(()=>el.style.display="none", 300); }, 1800);
  } else {
    el.className = "conn-banner conn-offline";
    el.textContent = "Firebase Disconnected — Reconnecting…";
    el.style.display = "block"; el.style.opacity = "1";
    clearTimeout(el._t);
  }
}

let renderScheduled = false;
function render() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => {
    renderScheduled = false;
    renderNow();
  });
}

function renderNow() {
  const root = $("#root");
  if (!root) return;

  // Splash only if BOTH not loaded
  if (!S.settingsLoaded && !S.authLoaded) {
    root.innerHTML = `
      <div class="splash">
        <div class="splash-logo">OL</div>
        <div style="text-align:center">
          <div class="fs-20 fw-800">${esc(S.settings.appName)}</div>
          <div class="fs-13 text-dim mt-2">${esc(S.settings.tagline)}</div>
        </div>
        <div class="spinner" style="margin-top:20px"></div>
      </div>`;
    return;
  }

  if (S.settings.maintenanceMode && (!S.profile || S.profile.role !== "admin")) {
    root.innerHTML = `
      <div class="app-shell">
        <div class="auth-wrap">
          <div class="auth-card text-center">
            <div style="font-size:56px;margin-bottom:12px">🛠️</div>
            <div class="fs-20 fw-800 mb-2">Under Maintenance</div>

          </div>
        </div>
      </div>`;
    return;
  }

  const route = S.currentRoute;

    <div class="app-shell">
      ${renderHeader()}
      ${S.guest ? `<div style="max-width:var(--content-max);margin:0 auto;padding:12px 16px 0;width:100%"><div class="guest-banner"><span>👤 Browsing as Guest</span><button class="btn btn-ghost" style="padding:6px 12px;min-height:auto;font-size:12px" onclick="window.__olim_nav('login')">Login</button></div></div>` : ""}
      ${page}

  requestAnimationFrame(() => {
    if (S.currentRoute === "trade" && !S.activeTrade && S.user && $("#trade-chart")) {
      drawTradeChart();

  });

/* ---------- Trade ---------- */
let tradeState = { market: "EUR/USD", amount: 1, duration: 60 };
let priceHistory = [];

function renderTradePage() {

  if (!S.user) return renderGuestTrade();

  const market = tradeState.market;
  const price = marketPrice(market);
  const bal = Number(S.wallet.balance || 0);
  const maxTrade = Math.min(bal, 100);
  const durations = (S.settings.durations || []).filter(d => d.enabled);
  const presets = [1,3,5,10,25,50,75,100];

  priceHistory.push({ t: nowMs(), p: price });
  priceHistory = priceHistory.filter(x => nowMs() - x.t < 60000);

  const canTrade = bal >= 1 && tradeState.amount <= bal;

  return `
    <div class="page">
      <div class="row-between mb-3">
        <div class="fs-20 fw-800">📈 Trade</div>
        <span class="mode-tag">DEMO / SIMULATION</span>

function fmtDur(s) {
  if (s < 60) return s + "s";
  if (s === 60) return "1m";
  return (s/60) + "m";
}

function renderActiveTrade(t) {
  const now = nowMs();
  const remain = Math.max(0, Math.floor((t.endTime - now) / 1000));
  const current = marketPrice(t.market);
  const win = (t.direction === "UP" && current > t.entryPrice) || (t.direction === "DOWN" && current < t.entryPrice);

  return `
    <div class="page">
      <div class="card text-center">
        <div class="fs-12 text-dim">ACTIVE TRADE</div>
        <div class="fs-24 fw-800 mt-2">${esc(t.market)}</div>
        <div class="mt-3">
          <span class="badge ${t.direction==="UP"?"badge-approved":"badge-rejected"}" style="font-size:14px;padding:6px 14px">${t.direction==="UP"?"⬆️ UP":"⬇️ DOWN"}</span>
        </div>

        <div class="countdown-ring mt-4">
          <div class="countdown-val" id="trade-count">${remain}</div>
        </div>
        <div class="fs-12 text-dim mt-2">Seconds remaining</div>

        <div class="grid-2 mt-4">
          <div class="card card-tight text-center">
            <div class="fs-11 text-dim">Amount</div>
            <div class="fs-16 fw-700">${fmtUSD(t.amount)}</div>
          </div>
          <div class="card card-tight text-center">
            <div class="fs-11 text-dim">Duration</div>
            <div class="fs-16 fw-700">${fmtDur(t.duration)}</div>
          </div>
          <div class="card card-tight text-center">
            <div class="fs-11 text-dim">Entry</div>
            <div class="fs-14 fw-700">${t.entryPrice < 10 ? t.entryPrice.toFixed(5) : t.entryPrice.toFixed(2)}</div>
          </div>
          <div class="card card-tight text-center">
            <div class="fs-11 text-dim">Current</div>
            <div class="fs-14 fw-700 ${win?"text-profit":"text-loss"}">${current < 10 ? current.toFixed(5) : current.toFixed(2)}</div>
          </div>
        </div>
      </div>

      <div class="card mt-3 text-center">
        <div class="fs-12 text-dim">Potential Payout</div>
        <div class="fs-24 fw-800 text-profit mt-2">+${fmtUSD(t.amount * (1 + (t.payoutRate||0.7)))}</div>
      </div>

      <div class="alert alert-warn mt-3 fs-12">Do not close this page. Trade will resolve automatically at expiry.</div>
    </div>`;
}

function renderTxRow(tx, kind) {
  const status = (tx.status || "Pending").toLowerCase();
  const badgeClass = status === "approved" ? "badge-approved" : status === "rejected" ? "badge-rejected" : status === "processing" ? "badge-processing" : "badge-pending";
  const date = new Date(tx.createdAt || Date.now()).toLocaleString();
  const label = kind === "deposit" ? "Deposit" : "Withdrawal";
  const amt = `$${Number(tx.usdAmount||0).toFixed(2)}`;

  return `
    <div class="list-item">
      <div class="row-between">
        <div>
          <div class="fw-600 fs-14">${label} · ${amt}</div>
          <div class="fs-11 text-mute">${esc(tx.paymentMethod || "")} · ${esc(date)}</div>
          ${tx.transactionId ? `<div class="fs-11 text-mute">Ref: ${esc(tx.transactionId)}</div>` : ""}
          ${tx.rejectionReason ? `<div class="fs-11 text-loss mt-1">Reason: ${esc(tx.rejectionReason)}</div>` : ""}
        </div>
        <span class="badge ${badgeClass}">${esc(tx.status || "Pending")}</span>
      </div>
    </div>`;
}

async function doSubmitDeposit() {
  const btn = $("#dep-submit");
  const txid = ($("#dep-txid")?.value || "").trim();
  const file = $("#dep-file")?.files?.[0] || null;
  if (S.settings.requireDepositScreenshot && !file) { toast("Screenshot required", "error"); return; }
  if (txid.length < 4) { toast("Invalid Payment Reference", "error"); return; }

  btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Submitting…`;
  try {
    await submitDeposit({
      usdAmount: depositState.usd,
      bdtAmount: depositState.usd * Number(S.settings.depositRate || 128),
      rate: Number(S.settings.depositRate || 128),
      method: depositState.method,
      transactionId: txid,
      screenshotFile: file,
    });
    toast("Deposit request submitted", "success");
    nav("wallet");
  } catch (e) {
    console.error(e);
    toast(e.message || "Submit failed", "error");
  } finally {
    btn.disabled = false; btn.innerHTML = "Submit Deposit Request";
  }
}

async function doSubmitWithdraw() {

  if (!amt || amt < 1) { toast("Invalid Amount", "error"); return; }
  if (amt > bal) { toast("Insufficient Balance", "error"); return; }
  if (!number || number.length < 6) { toast("Invalid payment number", "error"); return; }

  btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Submitting…`;
  try {
    await submitWithdrawal({ usdAmount: amt, method: wdState.method, number });
    toast("Withdrawal submitted", "success");
    nav("wallet");
  } catch (e) {
    toast(e.message || "Submit failed", "error");
  } finally {
    btn.disabled = false; btn.innerHTML = "Confirm Withdrawal";
  }
}

async function doLoginClick() {
  const btn = $("#li-submit");
  const email = ($("#li-email")?.value || "").trim();
  const pass = $("#li-pass")?.value || "";
  if (!email || !pass) { toast("Enter email and password", "error"); return; }
  btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>`;
  try {
    await doLogin(email, pass);
    S.guest = false;
    nav("home");
    toast("Welcome back!", "success");
  } catch (e) {
    const msg = (e.code || "").includes("user-not-found") ? "No account with that email"
      : (e.code || "").includes("wrong-password") ? "Incorrect password"
      : (e.code || "").includes("invalid-email") ? "Invalid Email"
      : (e.code || "").includes("too-many") ? "Too many attempts. Try again later."
      : (e.code || "").includes("invalid-credential") ? "Invalid email or password"
      : e.message || "Authentication Error";
    toast(msg, "error");
  } finally { btn.disabled = false; btn.innerHTML = "Login"; }
}

async function doSignupClick() {
  const btn = $("#su-submit");
  const name = ($("#su-name")?.value || "").trim();
  const phone = ($("#su-phone")?.value || "").trim();
  const email = ($("#su-email")?.value || "").trim();
  const pass = $("#su-pass")?.value || "";
  const pass2 = $("#su-pass2")?.value || "";
  const ref = ($("#su-ref")?.value || "").trim();

  if (name.length < 2) return toast("Enter a valid name", "error");
  if (!/^0?1\d{9}$/.test(phone.replace(/[^0-9]/g,""))) return toast("Invalid phone number", "error");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast("Invalid email", "error");
  if (pass.length < 6) return toast("Password must be at least 6 characters", "error");
  if (pass !== pass2) return toast("Passwords do not match", "error");

  btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>`;
  try {
    await doSignup({ name, phone, email, password: pass, referral: ref });
    nav("verifyEmail");
    toast("Account created! Check your email.", "success");
  } catch (e) {
    const msg = (e.code || "").includes("email-already-in-use") ? "Email already in use"
      : (e.code || "").includes("invalid-email") ? "Invalid Email"
      : (e.code || "").includes("weak-password") ? "Password too weak"
      : e.message || "Signup failed";
    toast(msg, "error");
  } finally { btn.disabled = false; btn.innerHTML = "Create Account"; }
}

    toast("Unable to process. Try again.", "error");
  } finally { btn.disabled = false; btn.innerHTML = "Send Reset Link"; }
}

            <button class="btn btn-primary btn-block mb-2" onclick="window.__olim_sendVerify()">Send Verification Link</button>
            <button class="btn btn-ghost btn-block mb-2" onclick="window.__olim_sendVerify()">Resend</button>
          ` : ""}
          <button class="btn btn-ghost btn-block mb-2" onclick="window.__olim_refreshVerify()">Refresh Status</button>
          <button class="btn btn-primary btn-block mt-3" onclick="window.__olim_nav('home')">Continue to App</button>
        </div>
      </div>
    </div>`;
}

/* ---------- Password Change Modal ---------- */
function showChangePasswordModal() {
  const modalRoot = $("#modal-root");
  modalRoot.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)window.__olim_closeModal()">
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="fs-18 fw-800 mb-3">🔐 Change Password</div>
        <div class="field"><label class="label">Current Password</label><input class="input" id="cp-old" type="password" /></div>
        <div class="field"><label class="label">New Password</label><input class="input" id="cp-new" type="password" /></div>
        <div class="field"><label class="label">Confirm New Password</label><input class="input" id="cp-new2" type="password" /></div>
        <div class="row" style="gap:8px">
          <button class="btn btn-ghost" style="flex:1" onclick="window.__olim_closeModal()">Cancel</button>
          <button class="btn btn-primary" style="flex:1" onclick="window.__olim_submitPassword()">Update</button>
        </div>
      </div>
    </div>`;
}

async function doChangePassword() {
  const oldP = $("#cp-old").value;
  const newP = $("#cp-new").value;
  const new2 = $("#cp-new2").value;
  if (!oldP || !newP) return toast("Fill all fields", "error");
  if (newP.length < 6) return toast("Password too short", "error");
  if (newP !== new2) return toast("Passwords do not match", "error");
  try {
    const cred = EmailAuthProvider.credential(auth.currentUser.email, oldP);
    await reauthenticateWithCredential(auth.currentUser, cred);
    await updatePassword(auth.currentUser, newP);
    window.__olim_closeModal();
    toast("Password updated", "success");
  } catch (e) {
    toast(e.message || "Failed to update", "error");
  }
}

/* ---------- Chart ---------- */
function drawTradeChart() {
  const canvas = $("#trade-chart");
  if (!canvas) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;

  ctx.clearRect(0, 0, w, h);

  ctx.strokeStyle = "rgba(34,48,82,0.5)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 5; i++) {
    const y = (h/5)*i;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  }

  if (priceHistory.length < 2) {
    ctx.fillStyle = "#5a6b8c"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("Loading chart...", w/2, h/2);
    return;
  }

  const prices = priceHistory.map(x => x.p);
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const range = max - min || 1;
  const pad = 12;
  const yFor = p => h - pad - ((p - min) / range) * (h - pad*2);
  const xFor = (i, n) => pad + (i/(n-1)) * (w - pad*2);

  const isUp = prices[prices.length-1] >= prices[0];
  const color = isUp ? "#10b981" : "#ef4444";

  const grd = ctx.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, isUp ? "rgba(16,185,129,0.35)" : "rgba(239,68,68,0.35)");
  grd.addColorStop(1, "rgba(0,0,0,0)");

  ctx.beginPath();
  prices.forEach((p,i) => {
    const x = xFor(i, prices.length), y = yFor(p);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.lineTo(w - pad, h);
  ctx.lineTo(pad, h);
  ctx.closePath();
  ctx.fillStyle = grd;
  ctx.fill();

  ctx.beginPath();
  prices.forEach((p,i) => {
    const x = xFor(i, prices.length), y = yFor(p);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();

  const lastX = xFor(prices.length-1, prices.length);
  const lastY = yFor(prices[prices.length-1]);
  ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
}

/* ---------- UI Tick ---------- */
setInterval(() => {
  if (S.activeTrade) {
    const remain = Math.max(0, Math.floor((S.activeTrade.endTime - nowMs())/1000));
    const el = $("#trade-count");
    if (el) el.textContent = remain;
  }
  if (S.currentRoute === "trade" && !S.activeTrade && S.user && $("#trade-chart")) {
    priceHistory.push({ t: nowMs(), p: marketPrice(tradeState.market) });
    priceHistory = priceHistory.filter(x => nowMs() - x.t < 60000);
    drawTradeChart();
  }
}, 1000);

/* ---------- Window Handlers ---------- */
window.__olim_nav = nav;
window.__olim_render = render;
window.__olim_openSupport = () => {
  const url = S.settings.support?.url;
  if (!isHttps(url)) { toast("Support URL not configured", "error"); return; }
  window.open(url, "_blank", "noopener,noreferrer");
};
window.__olim_openMarket = (symbol) => {
  tradeState.market = symbol;
  if (!S.user) { toast("Login required to trade"); nav("login"); return; }
  nav("trade");
};
window.__olim_setCat = (c) => { marketCategory = c; render(); };
window.__olim_setTradeMarket = (m) => { tradeState.market = m; render(); };
window.__olim_setTradeAmount = (v) => {
  const n = Number(v);
  if (!n || n <= 0) return;
  tradeState.amount = n;
  render();
};
window.__olim_setTradeDuration = (s) => { tradeState.duration = s; render(); };
window.__olim_placeTrade = async (dir) => {
  try { await placeTrade({
    marketSymbol: tradeState.market,
    direction: dir,
    amount: tradeState.amount,
    durationSec: tradeState.duration,
  }); }
  catch (e) { toast(e.message || "Trade failed", "error"); }
};
window.__olim_setDeposit = (v) => {
  const n = Number(v);
  if (!n || n <= 0) return;
  depositState.usd = n;
  render();
};
window.__olim_setMethod = (k) => { depositState.method = k; render(); };
window.__olim_submitDeposit = doSubmitDeposit;
window.__olim_setWdAmount = (v) => { const n = Number(v); if (n>0) { wdState.usd = n; render(); } };
window.__olim_setWdMethod = (k) => { wdState.method = k; render(); };
window.__olim_submitWithdraw = doSubmitWithdraw;
window.__olim_setHistFilter = (f) => { historyFilter = f; render(); };
window.__olim_sendVerify = async () => {
  try { await sendVerify(); toast("Verification link sent", "success"); }
  catch { toast("Send failed", "error"); }
};
window.__olim_refreshVerify = async () => {
  const v = await refreshVerification();
  toast(v ? "Email verified ✓" : "Still not verified", v ? "success" : "info");
  render();
};
window.__olim_submitNID = doSubmitNID;
window.__olim_login = doLoginClick;
window.__olim_signup = doSignupClick;
window.__olim_forgot = doForgotClick;
window.__olim_logout = async () => {
  await doLogout();
  nav("login");
  toast("Logged out", "success");
};
window.__olim_continueGuest = () => { S.guest = true; nav("home"); };
window.__olim_changePassword = showChangePasswordModal;
window.__olim_closeModal = () => { $("#modal-root").innerHTML = ""; };
window.__olim_submitPassword = doChangePassword;
window.__olim_copy = async (txt) => {
  try { await navigator.clipboard.writeText(txt); toast("Copied", "success"); }
  catch { toast("Copy failed", "error"); }
};
window.__olim_openNotification = async (id) => {
  const n = S.notifications.find(x => x.id === id);
  if (!n || !S.user) return;
  await update(ref(db, `notifications/${S.user.uid}/${id}`), { read: true });
  if (n.url) {
    if (n.url.startsWith("/")) nav(n.url.replace("/", ""));
    else if (isHttps(n.url)) window.open(n.url, "_blank", "noopener,noreferrer");
  }
};
window.__olim_markAllRead = async () => {
  if (!S.user) return;
  const updates = {};
  S.notifications.forEach(n => { if (!n.read) updates[`notifications/${S.user.uid}/${n.id}/read`] = true; });
  if (Object.keys(updates).length) {
    await update(ref(db), updates);
    toast("All marked as read", "success");
  }
};
window.__olim_openTutorial = (url) => {
  if (!url) return;
  if (isHttps(url)) window.open(url, "_blank", "noopener,noreferrer");
  else toast("Invalid tutorial URL", "error");
};

/* ---------- Bootstrap (IMPORTANT — non-blocking) ---------- */

// Subscribe to public data BEFORE auth (so settings load fast)
subscribeSettings();
subscribeMarkets();
subscribeTutorials();
subscribePaymentMethods();
subscribeConnection();

// Set initial route
S.currentRoute = (new URLSearchParams(location.search).has("ref") && !S.user) ? "signup" : "home";

// Initial render (splash)
render();

// Failsafe: force hide splash after 3s no matter what
setTimeout(() => {
  if (!S.settingsLoaded) S.settingsLoaded = true;
  if (!S.authLoaded) S.authLoaded = true;
  render();
}, 3000);

// Redraw chart on resize
let rt;
window.addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if ($("#trade-chart")) drawTradeChart(); }, 120);
});

</script>
